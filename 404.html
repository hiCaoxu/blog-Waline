<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 · CaoxuBlog</title>
  <meta name="robots" content="noindex" />
  <script>
    // 静态托管的 404 回退页：保留原有 hash 路由，交回 index.html 由前端路由接管。
    // 基准目录取当前路径的上一级，兼容根目录部署与 GitHub Pages 之类的子目录部署。
    (function () {
      var base = location.pathname.replace(/\/[^/]*$/, "/");
      location.replace(base + "index.html" + (location.hash || "#/blog"));
    })();
  </script>
</head>
<body>
  <p>页面不存在，正在返回首页… 若未自动跳转，请 <a href="index.html">点击这里</a>。</p>
</body>
</html>
