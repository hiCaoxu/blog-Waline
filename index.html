<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaoxuBlog · 没有完美的代码，只有未发现的缺陷</title>
  <meta name="description" content="CaoxuBlog — 测试工程师的成长笔记：博客、教程、题库与关于我。" />
  <meta name="author" content="Caoxu" />
  <meta name="theme-color" content="#f7f8f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)" />
  <link id="canonical" rel="canonical" href="https://hicaoxu.github.io/blog-Waline/" />

  <!-- Open Graph（社交分享） -->
  <meta property="og:site_name" content="CaoxuBlog" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <meta id="og-title" property="og:title" content="CaoxuBlog · 没有完美的代码，只有未发现的缺陷" />
  <meta id="og-desc" property="og:description" content="CaoxuBlog — 测试工程师的成长笔记：博客、教程、题库与关于我。" />
  <meta id="og-url" property="og:url" content="https://hicaoxu.github.io/blog-Waline/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta id="tw-title" name="twitter:title" content="CaoxuBlog · 没有完美的代码，只有未发现的缺陷" />
  <meta id="tw-desc" name="twitter:description" content="CaoxuBlog — 测试工程师的成长笔记：博客、教程、题库与关于我。" />

  <!-- 评论区（Waline）走 CDN，提前建连降低首评论加载延迟 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <link rel="alternate" type="application/rss+xml" title="CaoxuBlog · 博客 RSS" href="feed.xml" />
  <link rel="stylesheet" href="assets/style.css" />
  <!-- 代码高亮主题（本地化，默认浅色；深色由 app.js 动态切换） -->
  <link id="hljs-theme" rel="stylesheet" href="assets/vendor/highlight-github.min.css" />
</head>
<body>
  <!-- 光标特效画布：装饰层，不拦截点击 -->
  <canvas id="cursor-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="brand">
      <a href="#/blog" class="logo">CaoxuBlog</a>
      <p class="slogan">没有完美的代码，只有未发现的缺陷</p>
    </div>

    <nav class="top-nav" aria-label="主导航">
      <a href="#/blog" data-route="blog">博客</a>
      <a href="#/tutorial" data-route="tutorial">教程</a>
      <a href="#/bank" data-route="bank">题库</a>
      <a href="#/about" data-route="about">关于我</a>
    </nav>

    <div class="header-actions">
      <button id="search-toggle" class="icon-btn" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button id="theme-toggle" class="icon-btn" aria-label="切换明暗主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="site-main"></main>

  <footer class="site-footer">
    <span>© <span id="year"></span> CaoxuBlog</span>
    <span class="footer-sub">测试工程师的成长笔记 · 静态站点托管于腾讯云 COS</span>
  </footer>

  <!-- 搜索浮层 -->
  <div id="search-overlay" class="search-overlay hidden" role="dialog" aria-modal="true" aria-label="站内搜索">
    <div class="search-panel">
      <div class="search-head">
        <input id="search-input" type="search" placeholder="搜索博客、教程、题库…" autocomplete="off" />
        <button id="search-close" class="icon-btn" aria-label="关闭搜索">关闭</button>
      </div>
      <ul id="search-results" class="search-results"></ul>
      <p id="search-empty" class="search-empty hidden">没有匹配的结果。</p>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <!-- 内置 Markdown 解析器（零依赖，不依赖 CDN，由 app.js 的 md() 与 search.js 共用） -->
  <script src="assets/markdown.js"></script>
  <!-- 搜索与光标特效为非首屏能力，defer 延后执行，不阻塞首屏渲染 -->
  <script src="assets/search.js" defer></script>
  <script src="assets/cursor.js" defer></script>
  <!-- 代码语法高亮（highlight.js，已本地化到 assets/vendor，无需外网） -->
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/app.js"></script>
  <!-- Waline 评论（部署到腾讯云 CloudBase 后填写 serverURL 即可启用） -->
  <script src="https://cdn.jsdelivr.net/npm/@waline/client@3/dist/waline.iife.js" defer></script>
</body>
</html>
